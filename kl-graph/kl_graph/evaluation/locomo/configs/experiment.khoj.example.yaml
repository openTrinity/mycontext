schema_version: 1
benchmark: locomo
backend: khoj

source: ${oc.env:LOCOMO_SOURCE}
artifact_root: ../../../../data/locomo-khoj

selection:
  conversations:
    all: true
  questions:
    all: true

run:
  mode: resume
  output_dir: ../../../../data/locomo-khoj-run/ask
  keep_going: true

tracking:
  database: ../../../../data/evaluation/results.sqlite

khoj:
  base_url: ${oc.env:KHOJ_BASE_URL}

build:
  dataset_prefix: locomo
  timeout_seconds: 300

ask:
  top_k: 5
  concurrency: 4
  checkpoint_every: 10
  timeout_seconds: 120

generate:
  output_dir: ../../../../data/locomo-khoj-run/generate
  top_k: 5
  concurrency: 10
  checkpoint_every: 10
  provider: anthropic
  model: qwen3.7-flash
  base_url: ${oc.env:KL_LLM_BASE_URL}
  temperature: 0
  max_tokens: 128
  timeout_seconds: 120
  max_retries: 3
  include_community_context: false
  allow_remote_content: true

score:
  output_dir: ../../../../data/locomo-khoj-run/score
  recall_k: 5
