schema_version: 1
benchmark: longmemeval

# This schema currently orchestrates the KL Graph backend only. RAGFlow and
# Khoj may reuse its Score section after producing hypotheses independently.
# Relative paths are resolved from this YAML file. API keys are intentionally
# absent and remain environment-only.
source: ${oc.env:LONGMEMEVAL_SOURCE}
case_set: ../../../data/longmemeval
hypotheses: ../../../data/longmemeval/hypotheses.jsonl

selection:
  all: true

run:
  mode: resume
  output_dir: ../../../data/longmemeval
  keep_going: true

convert:
  timezone: Asia/Shanghai
  reconvert: false

build:
  with_improve: true
  fresh: false
  keep_cache: true
  case_concurrency: 3
  concurrency: 10

ask:
  case_concurrency: 3
  rerank_base_url: ${oc.env:KL_RERANK_BASE_URL}
  rerank_model: ${oc.env:KL_RERANK_MODEL}
  top_k: 5
  server_start_timeout_seconds: 60
  request_timeout_seconds: 180

generate:
  concurrency: 10
  provider: anthropic
  model: qwen3.7-flash
  base_url: ${oc.env:KL_LLM_BASE_URL}
  temperature: 0
  max_tokens: 500
  model_context_tokens: 128000
  timeout_seconds: 120
  max_retries: 2

score:
  output: ../../../data/longmemeval/score-results.jsonl
  metrics_output: ../../../data/longmemeval/score-metrics.json
  concurrency: 10
  judge:
    model: ${oc.env:LONGMEM_EVAL_MODEL}
    base_url: ${oc.env:OPENAI_BASE_URL}
    temperature: 0
    max_tokens: 10
    timeout_seconds: 120
    max_retries: 5
  retrieval:
    turn_recall:
      enabled: true
      k: 5
