[project]
name = "kl-graph"
version = "0.1.0"
description = "Spatio-temporal knowledge graph and retrieval over DingTalk workplace chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core: ingestion, storage, query engine, CLI
    "zvec>=0.6.0",
    "aiosqlite>=0.19.0",
    "litellm>=1.0",
    "jieba>=0.42",
    "ladybug>=0.18.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "tqdm>=4.60",
    "click>=8.0",
    "httpx>=0.27",
    # Windows has no system timezone database; required by ZoneInfo in
    # export_attendance.py and other scripts that use timezone-aware datetimes.
    "tzdata; platform_system == 'Windows'",
    # Retrieval server (kl_server.py)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Graph improvement: community detection, disambiguation, clustering
    "graspologic-native==1.3.1",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "scikit-learn>=1.4",
    "pypinyin>=0.51",
]

[project.optional-dependencies]
# Optional vector backend: Qdrant server or embedded mode
# Default is zvec (installed as a core dependency above)
qdrant = ["qdrant-client>=1.9.0"]
# Test runner and async-test support; install with `uv pip install -e ".[test]"`.
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kl_graph"]
