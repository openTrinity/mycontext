[project]
name = "kl-graph"
version = "0.1.0"
description = "Spatio-temporal knowledge graph and retrieval over DingTalk workplace chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core: ingestion, storage, query engine, CLI
    "qdrant-client>=1.9.0",
    "aiosqlite>=0.19.0",
    "litellm>=1.0",
    "jieba>=0.42",
    "numpy>=2.0",
    "pydantic>=2.0",
    "tqdm>=4.60",
    "click>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Persistent retrieval server (kl_server.py)
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Periodic improvement: communities, disambiguation, topical clustering
periodic = [
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "scikit-learn>=1.4",
    "pypinyin>=0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kl_graph"]
